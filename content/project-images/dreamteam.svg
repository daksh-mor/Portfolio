<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- Cricket Bat & Ball Sketch -->
    <g transform="translate(-70, -20) rotate(-25)">
      <!-- Cricket Bat Handle & Blade -->
      <rect x="-10" y="-80" width="20" height="50" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
      <path d="M -16,-30 L 16,-30 L 22,80 C 22,90 -22,90 -22,80 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Grip lines -->
      <line x1="-8" y1="-65" x2="8" y2="-65" stroke="#2E7D32" stroke-width="2"/>
      <line x1="-8" y1="-50" x2="8" y2="-50" stroke="#2E7D32" stroke-width="2"/>
    </g>

    <!-- Cricket Ball (Green Accent) -->
    <circle cx="-35" cy="50" r="22" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3.5"/>
    <path d="M -50,40 C -35,30 -35,70 -50,60 M -20,40 C -35,30 -35,70 -20,60" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- Prediction Analytics Graph Sketch on Right -->
    <g transform="translate(80, 0)">
      <rect x="-60" y="-60" width="120" height="120" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
      <line x1="-45" y1="40" x2="45" y2="40" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="-45" y1="-45" x2="-45" y2="40" stroke="#1A1A1A" stroke-width="2"/>

      <!-- Prediction Bar Chart & Trend Line -->
      <rect x="-35" y="10" width="12" height="30" fill="#2E7D32"/>
      <rect x="-15" y="-10" width="12" height="50" fill="#2E7D32"/>
      <rect x="5" y="-30" width="12" height="70" fill="#2E7D32"/>
      <rect x="25" y="-40" width="12" height="80" fill="#2E7D32"/>

      <path d="M -30,5 L -10,-15 L 10,-35 L 30,-45" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">DREAMTEAM — CRICKET FANTASY AI</text>
  <line x1="240" y1="398" x2="560" y2="398" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
</svg>
