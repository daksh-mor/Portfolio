<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- Envelope Base Sketch -->
    <rect x="-120" y="-60" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Envelope Flap Lines -->
    <path d="M -120,-60 L 0,25 L 120,-60" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
    <path d="M -120,90 L -30,10 M 120,90 L 30,10" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

    <!-- Green AI Checkmark Shield Badge Accent -->
    <g transform="translate(60, -35)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3.5"/>
      <path d="M -12,2 L -4,10 L 14,-8" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- AI Magic Sparkle Stars Accent -->
    <path d="M -80,-30 L -75,-45 L -60,-40 L -72,-28 L -80,-30 Z" fill="#2E7D32" stroke="#1A1A1A" stroke-width="1"/>
    <path d="M -50,-80 L -45,-95 L -30,-90 L -42,-78 Z" fill="#2E7D32" stroke="#1A1A1A" stroke-width="1"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">INTELLIDESK AI</text>
  <line x1="300" y1="398" x2="500" y2="398" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
</svg>
