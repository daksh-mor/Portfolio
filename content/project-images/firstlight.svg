<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Hand-drawn Monitor & Pixel Screen -->
  <g transform="translate(400, 220)">
    <!-- Monitor Stand -->
    <path d="M -35,130 L -15,90 L 15,90 L 35,130 Z" fill="#EAE5D8" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -60,130 L 60,130" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Monitor Outer Body (Warm Light Outline) -->
    <rect x="-240" y="-140" width="480" height="230" rx="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
    <path d="M -240,-130 C -240,-138 -232,-140 -220,-140" stroke="#888888" stroke-width="1.5" fill="none"/>

    <!-- Monitor Inner Black Display Screen -->
    <rect x="-225" y="-125" width="450" height="200" rx="6" fill="#0A0A0C" stroke="#222226" stroke-width="2"/>

    <!-- Subtle Grid / Scanline in Screen -->
    <path d="M -225,-25 L 225,-25 M -225,25 L 225,25" stroke="#18181B" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- Pixel Art Sunrise Graphic ("First Light") -->
    <g transform="translate(0, -65)">
      <!-- Pixel Sun Rays -->
      <rect x="-4" y="-32" width="8" height="8" fill="#F59E0B"/>
      <rect x="-32" y="-20" width="8" height="8" fill="#F59E0B"/>
      <rect x="24" y="-20" width="8" height="8" fill="#F59E0B"/>
      <rect x="-44" y="0" width="8" height="8" fill="#F59E0B"/>
      <rect x="36" y="0" width="8" height="8" fill="#F59E0B"/>
      
      <!-- Sun Core (Pixel Half Sun) -->
      <rect x="-16" y="-12" width="32" height="12" fill="#F59E0B"/>
      <rect x="-12" y="-20" width="24" height="8" fill="#FBBF24"/>
      
      <!-- Pixel Horizon Line -->
      <rect x="-140" y="4" width="280" height="3" fill="#FFFFFF"/>
      <rect x="-100" y="10" width="200" height="2" fill="#71717A"/>
    </g>

    <!-- App Main Prompt: "what's next?" -->
    <g transform="translate(0, 15)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">what's next?</text>
      <!-- Blinking Amber Pixel Cursor -->
      <rect x="105" y="-22" width="6" height="24" fill="#F59E0B"/>
    </g>

    <!-- Sub-Text Prompt inside Screen -->
    <g transform="translate(0, 52)">
      <rect x="-80" y="-12" width="160" height="22" rx="4" fill="#1C1C22" stroke="#27272A" stroke-width="1"/>
      <text x="0" y="3" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#A1A1AA" text-anchor="middle" letter-spacing="0.5">[enter] done   [esc] skip</text>
    </g>
  </g>

  <!-- Title Banner on Paper -->
  <g transform="translate(400, 395)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="2">FIRSTLIGHT · SINGLE-TASK MACOS APP</text>
  </g>
</svg>
