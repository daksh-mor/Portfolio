<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- Linear Regression Graph Sketch -->
    <g transform="translate(-130, -30)">
      <line x1="-30" y1="50" x2="60" y2="50" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="-30" y1="-40" x2="-30" y2="50" stroke="#1A1A1A" stroke-width="2"/>
      <!-- Scattered Points -->
      <circle cx="-15" cy="35" r="3" fill="#1A1A1A"/>
      <circle cx="0" cy="20" r="3" fill="#1A1A1A"/>
      <circle cx="20" cy="5" r="3" fill="#1A1A1A"/>
      <circle cx="45" cy="-25" r="3" fill="#1A1A1A"/>
      <!-- Regression Line (Blue Accent) -->
      <line x1="-25" y1="42" x2="55" y2="-32" stroke="#1976D2" stroke-width="3" stroke-linecap="round"/>
      <text x="-20" y="-25" font-family="monospace" font-size="14" font-weight="bold" fill="#1976D2">y = wx + b</text>
    </g>

    <!-- Transformer Block Sketch -->
    <g transform="translate(100, 0)">
      <rect x="-50" y="-70" width="100" height="130" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
      <rect x="-40" y="-55" width="80" height="30" rx="4" fill="#1976D2"/>
      <text x="0" y="-35" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ATTENTION</text>
      
      <rect x="-40" y="-15" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
      <text x="0" y="5" font-family="monospace" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="middle">FFN BLOCK</text>

      <path d="M 0,-70 L 0,-85 M 0,60 L 0,75" stroke="#1976D2" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">ML ALGOS FROM SCRATCH</text>
  <line x1="260" y1="398" x2="540" y2="398" stroke="#1976D2" stroke-width="2" stroke-linecap="round"/>
</svg>
