<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered WhiteBox Cube Sketch -->
  <g transform="translate(400, 205)">
    <!-- 3D Cube Isometric Lines -->
    <path d="M 0,-90 L 90,-40 L 90,60 L 0,110 L -90,60 L -90,-40 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,-90 L 0,110 M 0,-90 L -90,-40 M 0,-90 L 90,-40" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>

    <!-- Inner Blue Financial Candlestick Graph Accent -->
    <g transform="translate(-40, 20)">
      <line x1="-20" y1="20" x2="-20" y2="-10" stroke="#1976D2" stroke-width="2"/>
      <rect x="-26" y="0" width="12" height="15" fill="#1976D2"/>

      <line x1="10" y1="10" x2="10" y2="-40" stroke="#1976D2" stroke-width="2"/>
      <rect x="4" y="-30" width="12" height="25" fill="#1976D2"/>

      <line x1="40" y1="-10" x2="40" y2="-60" stroke="#1976D2" stroke-width="2"/>
      <rect x="34" y="-50" width="12" height="30" fill="#1976D2"/>

      <!-- Upward Trend Arrow -->
      <path d="M -30,25 Q 10,-20 60,-65" fill="none" stroke="#1976D2" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 45,-65 L 60,-65 L 60,-50" fill="none" stroke="#1976D2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Hatching Details -->
    <path d="M 15,-30 L 75,0 M 15,-10 L 75,20 M 15,10 L 75,40" stroke="#888888" stroke-width="1.2"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">WHITEBOX ENGINE</text>
  <line x1="290" y1="398" x2="510" y2="398" stroke="#1976D2" stroke-width="2" stroke-linecap="round"/>
</svg>
