<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- Newspaper Sheet Sketch -->
    <rect x="-100" y="-70" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5" transform="rotate(-6)"/>
    
    <!-- Headline & Article Lines -->
    <g transform="rotate(-6)">
      <rect x="-85" y="-55" width="60" height="8" fill="#1976D2"/>
      <line x1="-85" y1="-35" x2="45" y2="-35" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
      <line x1="-85" y1="-20" x2="45" y2="-20" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
      <line x1="-85" y1="-8" x2="45" y2="-8" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
      <line x1="-85" y1="5" x2="15" y2="5" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Sketchy Robot Feather / Quill Pen (Blue Accent) -->
    <path d="M 10,-80 C 40,-60 80,0 90,60 L 70,60 C 50,20 20,-30 -10,-60 Z" fill="#FFFFFF" stroke="#1976D2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 80,60 L 95,85 L 75,75 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M 10,-80 L 80,60" stroke="#1976D2" stroke-width="2"/>

    <!-- AI Sparkle Lines -->
    <path d="M 100,20 L 115,20 M 108,12 L 108,28" stroke="#1976D2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">AUTONOMOUS BLOG AGENT</text>
  <line x1="270" y1="398" x2="530" y2="398" stroke="#1976D2" stroke-width="2" stroke-linecap="round"/>
</svg>
