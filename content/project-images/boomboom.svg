<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Sketchy Content -->
  <g transform="translate(400, 210)">
    <!-- Sketched 3D Platforms -->
    <path d="M -220,90 L -80,40 L 100,70 L -40,120 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -220,90 L -220,120 L -40,150 L -40,120 Z" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100,70 L 100,100 L -40,150" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Hatching Lines on Platform Edge -->
    <path d="M -200,98 L -200,118 M -160,104 L -160,124 M -120,110 L -120,130 M -80,116 L -80,136" stroke="#888888" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Drawn Magic Ink Bridge (Cyan Accent) -->
    <path d="M -40,45 C 20,0 80,-30 150,-10 C 200,10 240,-20 280,-40" fill="none" stroke="#00ACC1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -38,48 C 22,3 82,-27 152,-7 C 202,13 242,-17 282,-37" fill="none" stroke="#00ACC1" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Stick Figure Player Running -->
    <g transform="translate(-100, -10)">
      <!-- Head -->
      <circle cx="0" cy="-45" r="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Body -->
      <path d="M 0,-31 L -5,10" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Arms in Action -->
      <path d="M -4,-20 L -25,-35 M -4,-20 L 18,-12" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
      <!-- Legs Running -->
      <path d="M -5,10 L -28,38 M -5,10 L 20,32" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Speed Lines -->
      <path d="M -40,-45 L -55,-45 M -42,-25 L -60,-25 M -45,-5 L -62,-5" stroke="#00ACC1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Sketchy Crown / Sparkles -->
    <path d="M -100,-75 L -108,-62 L -98,-65 L -100,-75 Z" fill="#00ACC1" stroke="#1A1A1A" stroke-width="1.5"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">BOOMBOOM - DOODLE ROYALE</text>
  <line x1="280" y1="398" x2="520" y2="398" stroke="#00ACC1" stroke-width="2" stroke-linecap="round"/>
</svg>
