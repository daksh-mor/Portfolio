<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- Left Box: Cursive Handwritten Text -->
    <rect x="-140" y="-60" width="110" height="120" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    <text x="-120" y="-20" font-family="'Brush Script MT', cursive, sans-serif" font-size="28" font-style="italic" fill="#555555">text</text>
    <text x="-120" y="20" font-family="'Brush Script MT', cursive, sans-serif" font-size="28" font-style="italic" fill="#555555">ocr</text>

    <!-- Transition Arrow (Green Accent) -->
    <path d="M -20,0 L 20,0" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/>
    <path d="M 10,-10 L 22,0 L 10,10" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Box: Crisp Printed OCR Text -->
    <rect x="30" y="-60" width="110" height="120" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3.5"/>
    <text x="50" y="-20" font-family="monospace" font-size="22" font-weight="bold" fill="#2E7D32">TEXT</text>
    <text x="50" y="20" font-family="monospace" font-size="22" font-weight="bold" fill="#2E7D32">OCR</text>

    <!-- Bounding Box Corner Reticles -->
    <path d="M 22,-52 L 22,-68 L 38,-68 M 132,-68 L 148,-68 L 148,-52 M 148,44 L 148,68 L 132,68 M 38,68 L 22,68 L 22,44" stroke="#2E7D32" stroke-width="2" fill="none"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">AI OF GOD 3.0 — OCR</text>
  <line x1="280" y1="398" x2="520" y2="398" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
</svg>
