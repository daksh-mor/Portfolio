<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- GIS Map Grid Frame -->
    <rect x="-110" y="-70" width="220" height="140" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
    
    <!-- Grid Lines -->
    <line x1="-110" y1="-20" x2="110" y2="-20" stroke="#CCCCCC" stroke-width="1.5" stroke-dasharray="6 3"/>
    <line x1="-110" y1="30" x2="110" y2="30" stroke="#CCCCCC" stroke-width="1.5" stroke-dasharray="6 3"/>
    <line x1="-30" y1="-70" x2="-30" y2="70" stroke="#CCCCCC" stroke-width="1.5" stroke-dasharray="6 3"/>
    <line x1="40" y1="-70" x2="40" y2="70" stroke="#CCCCCC" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Green Biodiversity Leaf & Pin Accent -->
    <path d="M -20,-40 Q 40,-40 20,20 Q -40,20 -20,-40 Z" fill="#2E7D32" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -20,-40 L 20,20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Location Pin Circle Accent -->
    <circle cx="20" cy="20" r="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/>
    <circle cx="20" cy="20" r="4" fill="#2E7D32"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">ECOPOLIS — URBAN BIODIVERSITY</text>
  <line x1="250" y1="398" x2="550" y2="398" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
</svg>
