<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- Tactical Shield Outline -->
    <path d="M 0,-100 L 90,-60 C 90,20 60,90 0,120 C -60,90 -90,20 -90,-60 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,-92 L 82,-56 C 82,18 54,82 0,110 C -54,82 -82,18 -82,-56 Z" fill="none" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Crosshair Lines Red Accent -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#D32F2F" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#D32F2F"/>

    <line x1="-65" y1="0" x2="-25" y2="0" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="65" y2="0" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-65" x2="0" y2="-25" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="25" x2="0" y2="65" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>

    <!-- Hatching Detail -->
    <path d="M -120,-20 L -90,-40 M -130,20 L -100,0 M 90,-40 L 120,-20 M 100,0 L 130,20" stroke="#888888" stroke-width="1.2"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">VALU - TACTICAL FPS</text>
  <line x1="290" y1="398" x2="510" y2="398" stroke="#D32F2F" stroke-width="2" stroke-linecap="round"/>
</svg>
