<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- Smartphone Frame -->
    <rect x="-60" y="-85" width="120" height="190" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
    <rect x="-52" y="-70" width="104" height="160" rx="10" fill="#2E7D32"/>

    <!-- Screen UI Elements (Green Accent) -->
    <text x="0" y="-40" font-family="monospace" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">$14,280</text>
    <text x="0" y="-22" font-family="monospace" font-size="11" fill="#C8E6C9" text-anchor="middle">+24.5% TOTAL RETURN</text>

    <!-- Upward Trend Line inside phone -->
    <path d="M -40,30 L -20,10 L 0,22 L 20,-10 L 40,-15" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="-15" r="4" fill="#FFFFFF"/>

    <!-- Pie Chart & Cards Sketch outside Phone -->
    <g transform="translate(-140, -20)">
      <circle cx="0" cy="0" r="35" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
      <path d="M 0,0 L 0,-35 A 35 35 0 0 1 35,0 Z" fill="#2E7D32" stroke="#1A1A1A" stroke-width="2"/>
    </g>

    <g transform="translate(130, 20)">
      <rect x="-30" y="-25" width="60" height="50" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
      <line x1="-20" y1="-10" x2="10" y2="-10" stroke="#2E7D32" stroke-width="3"/>
      <line x1="-20" y1="5" x2="20" y2="5" stroke="#1A1A1A" stroke-width="2"/>
    </g>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">INVESTSMART</text>
  <line x1="310" y1="398" x2="490" y2="398" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
</svg>
