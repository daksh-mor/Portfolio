<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="800" height="450" fill="#F7F4EB"/>
  
  <!-- Outer Hand-drawn Frame -->
  <path d="M 25,22 C 260,18 540,25 775,20 C 778,160 772,310 776,430 C 530,434 270,427 24,431 C 20,290 28,140 25,22 Z" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22,25 C 240,27 520,21 778,24 C 773,170 779,300 773,427 C 550,429 250,432 21,428 C 26,300 21,150 22,25 Z" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="12 4" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(400, 205)">
    <!-- Headphones Arc Sketch -->
    <path d="M -110,40 C -110,-70 110,-70 110,40" fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -106,40 C -106,-65 106,-65 106,40" fill="none" stroke="#FB8C00" stroke-width="1.5" stroke-dasharray="8 4"/>

    <!-- Left Ear Cup -->
    <rect x="-130" y="20" width="30" height="55" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="-115" y1="30" x2="-115" y2="65" stroke="#FB8C00" stroke-width="2"/>

    <!-- Right Ear Cup -->
    <rect x="100" y="20" width="30" height="55" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="115" y1="30" x2="115" y2="65" stroke="#FB8C00" stroke-width="2"/>

    <!-- Center Smartphone Sketch -->
    <rect x="-45" y="-50" width="90" height="150" rx="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
    <rect x="-38" y="-38" width="76" height="126" rx="8" fill="#1A1A1A"/>

    <!-- Musical Note & Sound Waves on Phone Screen (Orange Accent) -->
    <path d="M -10,-10 C -10,-25 15,-25 15,-5 L 15,15 C 15,20 8,25 0,20 C -8,15 -5,5 5,10" fill="none" stroke="#FB8C00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-5" cy="18" r="6" fill="#FB8C00"/>
    
    <!-- Wi-Fi Signal Waves -->
    <path d="M -20,-24 A 28 28 0 0 1 20,-24" fill="none" stroke="#FB8C00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -12,-30 A 18 18 0 0 1 12,-30" fill="none" stroke="#FB8C00" stroke-width="2" stroke-linecap="round"/>

    <!-- Music Equalizer Bars Below Phone -->
    <path d="M -80,120 L -80,95 M -65,120 L -65,85 M -50,120 L -50,105 M 50,120 L 50,105 M 65,120 L 65,85 M 80,120 L 80,95" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="385" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="2">SHAM — MUSIC GUESSING GAME</text>
  <line x1="260" y1="398" x2="540" y2="398" stroke="#FB8C00" stroke-width="2" stroke-linecap="round"/>
</svg>
